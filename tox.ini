[tox]
envlist = py38,py39,py310,py311,py312,lint,type-check

[testenv]
extras = test
commands = pytest {posargs}

[testenv:lint]
extras = dev
commands = 
    black --check src tests
    ruff check src tests

[testenv:type-check]
extras = dev
commands = mypy src

[testenv:format]
extras = dev
commands = 
    black src tests
    ruff check --fix src tests

[testenv:docs]
extras = docs
commands = sphinx-build -W -b html docs docs/_build/html